server.port=8081
# Default: embedded H2 file database (nothing to install). Data saved in ./data
spring.datasource.url=jdbc:h2:file:./data/classic;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
