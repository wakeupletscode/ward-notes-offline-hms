server.port=8080
# Default: embedded H2 file database (no install needed). Data saved in ./data
spring.datasource.url=jdbc:h2:file:./data/hms;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
